[tools]
"aqua:mikefarah/yq" = "4.45.4"
"aqua:jqlang/jq" = "1.8.1"
node = "26.10.0"

[tasks."dev:pnpm:update"]
description = "Update the workspace's pinned pnpm version inside the toolchain container"
run = "bash ./scripts/dev/run-pnpm-toolchain.sh pnpm self-update"

[tasks."dev:install"]
description = "Install workspace dependencies inside the repo pnpm toolchain container"
run = "bash ./scripts/dev/run-pnpm-toolchain.sh pnpm install --frozen-lockfile --prefer-offline"

[tasks."dev:install:fix-lock"]
description = "Repair the pnpm lockfile inside the repo pnpm toolchain container"
run = "bash ./scripts/dev/run-pnpm-toolchain.sh pnpm install --fix-lockfile"

[tasks."dev:install:no-lock"]
description = "Install workspace dependencies inside the repo pnpm toolchain container without lockfile"
run = "bash ./scripts/dev/run-pnpm-toolchain.sh pnpm install --no-frozen-lockfile"

[tasks."dev:deps:peers:check"]
description = "Check workspace peer dependency contracts without changing dependencies"
run = "bash ./scripts/dev/run-pnpm-toolchain.sh pnpm peers check"

[tasks."dev:deps:dedupe:check"]
description = "Report compatible dependency convergence without changing the lockfile"
run = "bash ./scripts/dev/run-pnpm-toolchain.sh pnpm dedupe --check"

[tasks."dev:deps:npkill"]
description = "Interactively clean node_modules trees inside the repo pnpm toolchain container"
run = "PNPM_TOOLCHAIN_TTY=1 bash ./scripts/dev/run-pnpm-toolchain.sh pnpx npkill -x -D -y"

[tasks."nx:lint"]
description = "Run the root lint:nx package script on the host"
run = "pnpm lint:nx"

[tasks."nx:affected"]
description = "Run the root nx:affected package script on the host"
run = "pnpm run nx:affected"
