# Prod overrides - use with: docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up --build
services:
  medusa-be:
    build:
      target: prod
      args:
        FEATURE_PPL_ENABLED: ${DC_FEATURE_PPL_ENABLED:-0}
        FEATURE_PAYLOAD_ENABLED: ${DC_FEATURE_PAYLOAD_ENABLED:-0}
        FEATURE_PACKETA_ENABLED: ${DC_FEATURE_PACKETA_ENABLED:-0}
        FEATURE_GLS_ENABLED: ${DC_FEATURE_GLS_ENABLED:-0}
    environment:
      NODE_ENV: production
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/health" ]
      start_period: 120s
      interval: 15s
      timeout: 10s
      retries: 8
    volumes: !reset []  # Remove inherited dev bind mounts in prod
  n1:
    build:
      target: prod
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${DC_N1_NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://localhost:9000}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${DC_N1_NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_SITE_URL: ${DC_N1_NEXT_PUBLIC_SITE_URL:-http://localhost:8000}
        NEXT_PUBLIC_MEILISEARCH_URL: ${DC_N1_NEXT_PUBLIC_MEILISEARCH_URL:-}
        NEXT_PUBLIC_MEILISEARCH_API_KEY: ${DC_N1_NEXT_PUBLIC_MEILISEARCH_API_KEY:-}
        NEXT_PUBLIC_META_PIXEL_ID: ${DC_N1_NEXT_PUBLIC_META_PIXEL_ID:-}
        NEXT_PUBLIC_GOOGLE_ADS_ID: ${DC_N1_NEXT_PUBLIC_GOOGLE_ADS_ID:-}
        NEXT_PUBLIC_LEADHUB_TRACKING_ID: ${DC_N1_NEXT_PUBLIC_LEADHUB_TRACKING_ID:-}
        NEXT_PUBLIC_HEUREKA_API_KEY: ${DC_N1_NEXT_PUBLIC_HEUREKA_API_KEY:-}
    environment:
      NODE_ENV: production
    volumes: !reset []  # Remove inherited dev bind mounts in prod
  herbatika:
    build:
      target: prod
      args:
        ALLOWED_MARKETS: ${DC_HERBATIKA_ALLOWED_MARKETS:-sk,cz,hu,ro}
        MARKET_ACCEPTED_HOSTS_SK: ${DC_HERBATIKA_MARKET_ACCEPTED_HOSTS_SK:-}
        MARKET_ACCEPTED_HOSTS_CZ: ${DC_HERBATIKA_MARKET_ACCEPTED_HOSTS_CZ:-}
        MARKET_ACCEPTED_HOSTS_HU: ${DC_HERBATIKA_MARKET_ACCEPTED_HOSTS_HU:-}
        MARKET_ACCEPTED_HOSTS_RO: ${DC_HERBATIKA_MARKET_ACCEPTED_HOSTS_RO:-}
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${DC_HERBATIKA_NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://localhost:9000}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${DC_HERBATIKA_NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_STOREFRONT_AUTH_MODE: ${DC_HERBATIKA_NEXT_PUBLIC_STOREFRONT_AUTH_MODE:-session_proxy}
        NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_ENABLED: ${DC_HERBATIKA_NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_ENABLED:-${DC_CLOUDFLARE_TURNSTILE_ENABLED:-0}}
        NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY: ${DC_HERBATIKA_NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_PAYLOAD_BASE_URL: ${DC_HERBATIKA_NEXT_PUBLIC_PAYLOAD_BASE_URL:-http://localhost:8083}
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          case ",$${ALLOWED_MARKETS}," in
            *,sk,*) host=$${MARKET_ACCEPTED_HOSTS_SK%%,*} ;;
            *,cz,*) host=$${MARKET_ACCEPTED_HOSTS_CZ%%,*} ;;
            *,hu,*) host=$${MARKET_ACCEPTED_HOSTS_HU%%,*} ;;
            *,ro,*) host=$${MARKET_ACCEPTED_HOSTS_RO%%,*} ;;
          esac;
          test -n "$$host" &&
          curl -fsS -H "Host: $$host" http://127.0.0.1:3000/api/healthz
      start_period: 120s
      interval: 15s
      timeout: 10s
      retries: 8
    volumes: !reset []  # Remove inherited dev bind mounts in prod
  payload:
    build:
      target: prod
      args:
        DATABASE_URL: ${DC_PAYLOAD_DATABASE_URL:-postgresql://payload:payload@localhost:5432/payload}
        PAYLOAD_SECRET: ${DC_PAYLOAD_SECRET:-payload_build_secret}
        PAYLOAD_LOCALES: ${DC_PAYLOAD_LOCALES:-cs,en,sk,pl,hu,ro,sl}
        FEATURE_PAYLOAD_ARTICLES_ENABLED: ${DC_FEATURE_PAYLOAD_ARTICLES_ENABLED:-1}
        FEATURE_PAYLOAD_PAGES_ENABLED: ${DC_FEATURE_PAYLOAD_PAGES_ENABLED:-1}
        FEATURE_PAYLOAD_HERO_CAROUSELS_ENABLED: ${DC_FEATURE_PAYLOAD_HERO_CAROUSELS_ENABLED:-1}
        S3_ENDPOINT: ${DC_PAYLOAD_S3_ENDPOINT:-http://localhost:9004}
        S3_REGION: ${DC_PAYLOAD_S3_REGION:-us-east-1}
        S3_BUCKET: ${DC_PAYLOAD_S3_BUCKET:-payload}
        S3_ACCESS_KEY_ID: ${DC_PAYLOAD_S3_ACCESS_KEY_ID:-payload}
        S3_SECRET_ACCESS_KEY: ${DC_PAYLOAD_S3_SECRET_ACCESS_KEY:-payload}
    environment:
      NODE_ENV: production
    working_dir: /app/apps/payload
    command: ["node", "server.js"]
    volumes: !reset []  # Remove inherited dev bind mounts in prod
  zane-operator:
    build:
      target: prod
    environment:
      NODE_ENV: production
      ZANE_OPERATOR_RUNTIME_COMMAND: /app/zane-operator
    volumes: !reset []
