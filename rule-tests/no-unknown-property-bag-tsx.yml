id: no-unknown-property-bag-tsx
valid:
  - |
    type Payload = object
    const Panel = ({ payload }: { payload: Payload }) => <pre>{String(payload)}</pre>
  - |
    type KnownFields = Record<"id" | "slug", unknown>
    const Panel = () => <div />
  - |
    interface Payload { id: string; metadata: unknown }
    const Panel = ({ payload }: { payload: Payload }) => <span>{payload.id}</span>
  - |
    type KnownFields = Record<"id" | "slug", unknown | string>
    const Panel = () => <div />
  - |
    type FiniteDictionary<T> = Record<"value", T>
    const Panel = () => <div />
  - |
    type DeferredDictionary = Record<string, Promise<unknown>>
    const Panel = () => <div />
  - |
    type DeferredOrTextDictionary = Record<string, Promise<unknown> | string>
    const Panel = () => <div />
  - |
    interface DomainObject { value: unknown | undefined }
    const Panel = () => <div />
  - |
    type SourceIdIndex<T> = Map<string, T[]>
    const Panel = () => <div />
  - |
    type DeferredIndex<T> = Record<string, Promise<T>>
    const Panel = () => <div />
