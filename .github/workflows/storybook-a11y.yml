name: Storybook A11y (APCA)

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storybook-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Must list every supported pair; the script fails on a count mismatch.
        theme:
          [business-light, akros-light, n1-light]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline --network-concurrency=4
      - run: timeout 420 pnpm exec playwright install --only-shell chromium
      - id: storybook-inputs
        run: |
          hash="$(node libs/ui/scripts/visual-storybook-build.mjs --inputs-hash)"
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"
      # The script re-checks the build marker, so a restored build is used only when it matches the checked-out inputs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: libs/ui/storybook-static
          key: ui-storybook-v1-${{ steps.storybook-inputs.outputs.hash }}
      # One supported pair per job; calibration failures are asserted separately.
      # WCAG A/AA rules block; APCA gold and AAA contrast are reported only.
      - name: Enforce product accessibility and reporter calibration
        id: a11y
        env:
          A11Y_REPORT_FAIL_ON_VIOLATIONS: "true"
          A11Y_THEME: ${{ matrix.theme }}
          A11Y_THEME_COUNT: "3"
        run: pnpm --dir libs/ui storybook:a11y
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: storybook-a11y-${{ inputs.sha || github.sha }}-${{ matrix.theme }}
          path: libs/ui/a11y-report
          if-no-files-found: error
