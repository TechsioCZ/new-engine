name: Storybook A11y (APCA)

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      scope:
        description: full or all scans every story; anything else narrows the scan to the changed files
        type: string
        default: full
      workers:
        description: Jest workers per theme
        type: number
        default: 4
      changed_files_artifact:
        description: Artifact holding the changed-file list a narrowed scan needs
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      scope:
        description: full or all scans every story; anything else narrows the scan to the changed files
        type: string
        default: full
      workers:
        description: Jest workers per theme
        type: number
        default: 4

permissions:
  contents: read

jobs:
  storybook-a11y:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/libs/ui/test/visual.spec.ts-snapshots/
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1
      # Only the UI library and what it depends on takes part in this scan.
      - run: pnpm install --frozen-lockfile --prefer-offline --filter='@techsio/ui-kit...'
      - name: Restore the accessibility browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ui-a11y-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: timeout 420 pnpm --dir libs/ui exec playwright install --only-shell chromium
      - name: Download the changed-file list
        if: inputs.scope != 'full' && inputs.scope != 'all' && inputs.changed_files_artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.changed_files_artifact }}
          path: ${{ runner.temp }}/a11y-changed-files
      # One install and Storybook build for all supported themes. WCAG A/AA rules block;
      # APCA gold and AAA contrast are reported only. Story coverage and the
      # calibration contract are asserted over the theme's shards together, by
      # scripts/verify-a11y-shards.mjs over these artifacts.
      - name: Enforce product accessibility and reporter calibration
        id: a11y
        env:
          A11Y_REPORT_FAIL_ON_VIOLATIONS: "true"
          A11Y_THEME_COUNT: "3"
          A11Y_SHARD: 1/1
          A11Y_TEST_WORKERS: ${{ inputs.workers }}
          A11Y_SCOPE: ${{ inputs.scope }}
          A11Y_CHANGED_FILES_FROM: ${{ runner.temp }}/a11y-changed-files/changed-files.txt
        run: pnpm --dir libs/ui storybook:a11y
      - name: Verify all themes and calibration reported
        run: |
          node --input-type=module -e '
            import { createThemeMatrix } from "./libs/ui/test/visual-projects.mjs";
            const themes = createThemeMatrix().map(({brand,mode}) => brand + "-" + mode);
            console.log(JSON.stringify({a11y:{themes,shards_per_theme:1,total:themes.length}}));
          ' > "$RUNNER_TEMP/a11y-expected.json"
          node libs/ui/scripts/verify-a11y-shards.mjs \
            --expect "$RUNNER_TEMP/a11y-expected.json" --reports libs/ui/a11y-report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: storybook-a11y-${{ inputs.sha || github.sha }}-all-themes
          path: libs/ui/a11y-report
          if-no-files-found: error
