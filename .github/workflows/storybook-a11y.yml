name: Storybook A11y (APCA)

on:
  workflow_dispatch:
    inputs:
      workers:
        description: Jest workers per theme runner
        type: number
        default: 4

permissions:
  contents: read

jobs:
  # One runner per theme: a scan keeps about 1.3 of 4 vCPUs busy, so themes in
  # sequence on one runner (427s measured) wait on latency, not CPU. WCAG A/AA
  # rules block; APCA gold and AAA contrast are reported only.
  scan:
    name: scan (${{ matrix.theme }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # A11Y_THEME_COUNT fails every entry when a theme is added without one.
      matrix:
        theme: [business-light, akros-light, n1-light]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/libs/ui/test/visual.spec.ts-snapshots/
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1
      # Only the UI library and what it depends on, for this host's platform:
      # supportedArchitectures otherwise downloads darwin, arm64 and musl too.
      - run: pnpm install --frozen-lockfile --prefer-offline --os linux --cpu x64 --libc glibc --filter='@techsio/ui-kit...'
      - name: Restore the accessibility browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ui-a11y-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: timeout 420 pnpm --dir libs/ui exec playwright install --only-shell chromium
      - name: Hash the shared Storybook inputs
        id: storybook
        run: echo "hash=$(node libs/ui/scripts/visual-storybook-build.mjs --inputs-hash)" >> "$GITHUB_OUTPUT"
      - name: Reuse the same Storybook content cache as CI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: libs/ui/storybook-static
          key: ui-storybook-node26-${{ steps.storybook.outputs.hash }}
      - name: Build Storybook on a cache miss
        run: node libs/ui/scripts/visual-storybook-build.mjs --ensure
      - name: Enforce product accessibility and reporter calibration
        env:
          A11Y_STORYBOOK_REBUILD: "0"
          A11Y_REPORT_FAIL_ON_VIOLATIONS: "true"
          A11Y_THEME: ${{ matrix.theme }}
          A11Y_THEME_COUNT: "3"
          A11Y_SHARD: 1/1
          A11Y_TEST_WORKERS: ${{ inputs.workers }}
        run: pnpm --dir libs/ui storybook:a11y
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: storybook-a11y-${{ github.sha }}-${{ matrix.theme }}
          path: libs/ui/a11y-report
          overwrite: true
          if-no-files-found: error

  # Story coverage and the calibration contract over every supported theme,
  # as CI's quality-gate proves them: a theme that never reported fails here.
  verify:
    needs: scan
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /libs/ui/scripts/
            /libs/ui/test/*.mjs
            /libs/ui/test/*.json
            /libs/ui/src/tokens/figma/brands.json
            /libs/ui/.storybook/a11y-policy.mjs
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1
      - name: Prepare the report directory
        run: mkdir -p "$RUNNER_TEMP/a11y-shards"
      - name: Download every theme's report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: storybook-a11y-${{ github.sha }}-*
          path: ${{ runner.temp }}/a11y-shards
      - name: Verify all themes and calibration reported
        run: |
          node --input-type=module -e '
            import { createThemeMatrix } from "./libs/ui/test/visual-projects.mjs";
            const themes = createThemeMatrix().map(({brand,mode}) => brand + "-" + mode);
            const shards = Object.fromEntries(themes.map((theme) => [theme, 1]));
            console.log(JSON.stringify({scope:"full",a11y:{themes,shards,total:themes.length}}));
          ' > "$RUNNER_TEMP/a11y-expected.json"
          node libs/ui/scripts/verify-a11y-shards.mjs \
            --expect "$RUNNER_TEMP/a11y-expected.json" --reports "$RUNNER_TEMP/a11y-shards"
