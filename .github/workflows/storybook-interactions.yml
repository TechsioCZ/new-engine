name: Storybook Interactions

# Runs Storybook play functions and gates the PR on their result.
#
# The storybook-a11y workflow already executes every story through the test-runner,
# but its pass/fail comes from the axe baseline comparison — the runner's exit code is
# discarded, so a broken play assertion shows up as a green check. This workflow runs
# the same runner with axe off (A11Y_REPORT_ENABLED=0) and gates on the exit code, so
# interaction failures are their own signal.

on:
  pull_request:
    paths:
      - "libs/ui/**"
      - ".github/workflows/storybook-interactions.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/install-storybook-playwright.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-interactions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storybook-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with:
          run_install: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --filter='.' --filter='@techsio/ui-kit...'

      # Installs the browser through the playwright package that @storybook/test-runner
      # actually resolves, so the downloaded revision matches the runtime. --only-shell
      # avoids the apt hang that --with-deps triggers on GitHub runners.
      - name: Install Playwright chromium shell
        run: node scripts/install-storybook-playwright.mjs libs/ui install --only-shell chromium

      - name: Build Storybook
        run: pnpm -C libs/ui run build:storybook

      - name: Run interaction tests
        run: SKIP_BUILD=1 pnpm -C libs/ui run test:interactions
