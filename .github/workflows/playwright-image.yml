name: Playwright Image

# Publishes the component-test container once per Dockerfile, instead of letting
# every component shard rebuild it (measured 1.9 min x 8 shards x 2 workflows on
# fresh runners, where `docker image inspect` always misses).
#
# The tag is content-addressed: <Playwright version>-<Dockerfile hash>, the same
# string libs/ui/scripts/run-component-tests.mjs computes and asserts before it
# uses the image, so a pulled image and a locally built one are the same
# artifact. A commit that changes the Dockerfile has no published tag yet and
# builds from the commit under test; this workflow then publishes the new tag.
#
# ONE-TIME MANUAL STEP: set the package
# ghcr.io/techsiocz/new-engine-ui-playwright to public visibility after the
# first run. GITHUB_TOKEN cannot change package visibility (that needs a PAT
# with admin:packages), and a public package is what lets runners pull
# anonymously, with no login and no packages: read — including on pull requests
# from forks. Until then the pull simply finds nothing and shards build as
# before: slower, never wrong.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - docker/development/playwright/**
      - .github/workflows/playwright-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: playwright-image-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1

      # One definition of the tag. --print-plan resolves the image reference and
      # exits without Docker or Storybook, and it imports only node: builtins
      # and sibling files under libs/ui, so no install is needed here.
      - name: Resolve the content-addressed image reference
        id: image
        env:
          PLAYWRIGHT_DOCKER_PLATFORM: linux/amd64
        run: |
          reference=$(node libs/ui/scripts/run-component-tests.mjs \
            --print-plan | jq -er .image)
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "Publishing $reference"

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      # linux/amd64 only: the 1818 committed screenshot baselines were recorded
      # on amd64 runners, and local arm64 runs use an -arm64 tag that is built
      # on the developer's machine.
      - name: Build and push
        env:
          REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          docker build --platform=linux/amd64 \
            --tag "$REFERENCE" \
            --file docker/development/playwright/Dockerfile .
          docker push "$REFERENCE"
