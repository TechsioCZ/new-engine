name: Storybook A11y Baseline (APCA)

on:
  push:
    branches:
      - master
    paths:
      - "libs/ui/.storybook/**"
      - "libs/ui/assets/**"
      - "libs/ui/package.json"
      - "libs/ui/playwright.config.mts"
      - "libs/ui/postcss.config.mjs"
      - "libs/ui/project.json"
      - "libs/ui/rslib.config.ts"
      - "libs/ui/scripts/storybook-a11y*"
      - "libs/ui/src/**"
      - "libs/ui/stories/**"
      - "libs/ui/tsconfig.json"
      - ".github/workflows/storybook-a11y.yml"
      - ".github/workflows/storybook-a11y-baseline.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storybook-a11y-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --filter='.' --filter='@techsio/ui-kit...'

      - name: Install Playwright browsers
        # pnpm-workspace.yaml pins the test runner's Playwright to the
        # workspace version, so the root CLI installs the matching browser.
        run: timeout 420 pnpm exec playwright install --only-shell chromium

      # Explicitly report-only; product enforcement lives in the required quality workflow.
      - name: Collect all supported brand and mode baselines
        id: a11y
        run: pnpm -C libs/ui storybook:a11y:report

      - name: Upload brand/mode-keyed baselines and calibration results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-a11y-baseline-${{ github.sha }}
          path: libs/ui/a11y-report
          if-no-files-found: error
          retention-days: 30
