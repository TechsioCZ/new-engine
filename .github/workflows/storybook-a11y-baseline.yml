name: Storybook A11y Baseline (APCA)

on:
  push:
    branches:
      - master
    paths:
      - "libs/ui/.storybook/**"
      - "libs/ui/assets/**"
      - "libs/ui/package.json"
      - "libs/ui/playwright.config.mts"
      - "libs/ui/postcss.config.mjs"
      - "libs/ui/project.json"
      - "libs/ui/rslib.config.ts"
      - "libs/ui/scripts/storybook-a11y*"
      - "libs/ui/src/**"
      - "libs/ui/stories/**"
      - "libs/ui/tsconfig.json"
      - ".github/workflows/storybook-a11y.yml"
      - ".github/workflows/storybook-a11y-baseline.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storybook-a11y-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --filter='.' --filter='@techsio/ui-kit...'

      - name: Install Playwright browsers
        # pnpm-workspace.yaml pins the test runner's Playwright to the
        # workspace version, so the root CLI installs the matching browser.
        run: timeout 420 pnpm exec playwright install --only-shell chromium

      # Same entry point as local runs: build, serve, then test both themes.
      - name: Run a11y tests (light and dark themes)
        id: a11y
        env:
          A11Y_REPORT_FAIL_ON_VIOLATIONS: "false"
        run: pnpm -C libs/ui storybook:a11y

      # The PR workflow downloads <prefix>-<theme> and reads report.json at its root.
      - name: Upload baseline report (light)
        if: always() && steps.a11y.outputs.report-dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-a11y-baseline-light
          path: ${{ steps.a11y.outputs.report-dir }}/light/report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload baseline report (dark)
        if: always() && steps.a11y.outputs.report-dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-a11y-baseline-dark
          path: ${{ steps.a11y.outputs.report-dir }}/dark/report.json
          if-no-files-found: ignore
          retention-days: 30
