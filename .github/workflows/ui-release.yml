name: UI Release

# Prepare alongside CI, then publish only after the exact commit's full gate.
# Starting checkout/install after workflow_run added two minutes to the chain.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_release:
        description: Run the UI release even when Nx does not mark ui-kit as affected.
        required: false
        type: boolean
        default: false
      dry_run:
        description: Run semantic-release with --dry-run. Resolves and prints the next version, publishes nothing.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ui-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # Push and manual dispatch both validate and publish this immutable SHA.
      - name: Resolve the commit to release
        id: commit
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="$HEAD_SHA"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Resolved commit is not a full SHA: '$sha'"
            exit 1
          fi
          echo "Releasing commit $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The thing that stops a silent SHA swap: everything below builds and
      # publishes from this working tree, so it must be the commit CI validated.
      - name: Assert the checkout is the resolved commit
        env:
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $actual, expected $EXPECTED_SHA"
            exit 1
          fi
          echo "Working tree is $actual"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1
          cache: 'pnpm'
          registry-url: https://registry.npmjs.org
          scope: '@techsio'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Compare against the last published UI release
        env:
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          tag="$(git describe --tags --match 'ui-kit-v*' --abbrev=0 "$HEAD_SHA")"
          base="$(git rev-parse "${tag}^{commit}")"
          echo "NX_BASE=$base" >> "$GITHUB_ENV"
          echo "NX_HEAD=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "Unpublished changes since $tag ($base) through $HEAD_SHA"

      # Two reasons not to publish, both normal outcomes rather than failures:
      # a newer commit is already master's tip (that push's CI releases it, and
      # publishing a stale tree would be wrong), or Nx says ui-kit is untouched.
      # semantic-release reads the branch from GITHUB_REF. Recheck the tip
      # after the CI wait as well, so preparation cannot publish a stale tree.
      - name: Decide whether to publish this commit
        id: decide
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release }}
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)"
          if [ "$tip" != "$HEAD_SHA" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$HEAD_SHA is no longer the tip of master ($tip); that commit's CI run releases instead."
            exit 0
          fi

          if [ "$FORCE_RELEASE" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "UI release was manually forced"
            exit 0
          fi

          AFFECTED="$(./node_modules/.bin/nubx --node nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD")"
          echo "$AFFECTED"
          if printf '%s\n' "$AFFECTED" | grep -q '^ui-kit$'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "UI library is affected, will proceed with release"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "UI library is not affected, skipping release"
          fi

      - name: Update npm (trusted publishing needs >= 11.5.1)
        if: steps.decide.outputs.publish == 'true'
        run: npm install -g npm@latest

      # The last gate before npm publish: rslib build with output checks,
      # validate-package-exports and check:consumer, 11s.
      - name: Check UI package output
        if: steps.decide.outputs.publish == 'true'
        run: pnpm -C libs/ui check:package

      - name: Require successful push CI for this exact commit
        if: steps.decide.outputs.publish == 'true' && !inputs.dry_run
        env:
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while true; do
            run="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f event=push -f head_sha="$HEAD_SHA" -f branch=master \
              --jq '.workflow_runs | first | {id, status, conclusion}')"
            status="$(jq -r '.status // "pending"' <<< "$run")"
            if [ "$status" = completed ]; then
              [ "$(jq -r .conclusion <<< "$run")" = success ] || {
                echo "::error::Push CI did not succeed for $HEAD_SHA: $run"
                exit 1
              }
              break
            fi
            echo "Waiting for exact-SHA push CI: $status"
            sleep 10
          done
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)"
          [ "$tip" = "$HEAD_SHA" ] || {
            echo "::error::$HEAD_SHA is no longer master ($tip); refusing a stale publish."
            exit 1
          }

      - name: Fetch semantic-release notes
        if: steps.decide.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/notes/*:refs/notes/*" || true

      - name: Run semantic-release
        if: steps.decide.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: resolving the next version without publishing."
            pnpm -C libs/ui exec semantic-release --dry-run
            exit 0
          fi
          pnpm -C libs/ui semantic-release
