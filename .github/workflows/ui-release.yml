name: UI Release

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      force_release:
        description: Run the UI release even when Nx does not mark ui-kit as affected.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ui-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-affected:
    runs-on: ubuntu-latest
    outputs:
      is_affected: ${{ steps.check.outputs.is_affected }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          main-branch-name: master

      - name: Check if UI is affected
        id: check
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release }}
        run: |
          if [ "$FORCE_RELEASE" = "true" ]; then
            echo "is_affected=true" >> "$GITHUB_OUTPUT"
            echo "UI release was manually forced"
            exit 0
          fi

          AFFECTED=$(./node_modules/.bin/nubx --node nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD")
          echo "$AFFECTED"
          if echo "$AFFECTED" | grep -q "^ui-kit$"; then
            echo "is_affected=true" >> "$GITHUB_OUTPUT"
            echo "UI library is affected, will proceed with release"
          else
            echo "is_affected=false" >> "$GITHUB_OUTPUT"
            echo "UI library is not affected, skipping release"
          fi

  release:
    needs: check-affected
    if: needs.check-affected.outputs.is_affected == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          registry-url: https://registry.npmjs.org
          scope: '@techsio'

      - name: Update npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --filter=@techsio/ui-kit...

      - name: Check UI package output
        run: pnpm -C libs/ui check:package

      - name: Fetch semantic-release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/notes/*:refs/notes/*" || true

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm -C libs/ui semantic-release
