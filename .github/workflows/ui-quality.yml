name: UI quality

on:
  workflow_call:
    inputs:
      sha:
        description: Immutable commit to validate and publish
        required: true
        type: string
      mode:
        description: full runs everything; changed runs only what the diff can affect
        type: string
        default: full
      base_sha:
        description: Base commit for changed mode; empty falls back to the full run
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      list: ${{ steps.scope.outputs.list }}
      component_matrix: ${{ steps.scope.outputs.component_matrix }}
      a11y_shards: ${{ steps.scope.outputs.a11y_shards }}
    steps:
      - if: inputs.mode == 'changed'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - if: inputs.mode == 'changed'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1
      # Any doubt (no base, no merge-base) keeps the full scope; never "none".
      # -z keeps paths unquoted, so non-ASCII names still reach the classifier.
      - id: scope
        env:
          MODE: ${{ inputs.mode }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.sha }}
          # Must match storybook-a11y.yml's theme matrix; that scan fails on a
          # count mismatch, so a drift here cannot pass silently.
          A11Y_THEMES: '["business-light","akros-light","n1-light"]'
        run: |
          set -euo pipefail
          scope=full
          list=false
          if [ "$MODE" = "changed" ] && [ -n "$BASE_SHA" ] && base="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null)"; then
            git diff -z --name-only --no-renames "$base" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
            scope="$(node libs/ui/scripts/visual-affected-stories.mjs --scope --files-from "$RUNNER_TEMP/changed-files.txt")"
            list=true
          fi
          # Job widths are a slot budget, not a preference: the free plan allows
          # 20 concurrent jobs account-wide. Full run = 11 component + 6 a11y +
          # main + package + the GitHub-managed CodeQL job = 20 exactly. Changed
          # run = 4 + 3 heavy, so two concurrent pull requests still fit 20.
          # Adding a job to either shape means taking one away.
          #
          # The widths are measured, not estimated: run 43882857373 on this
          # branch gave per-shard test times of 4.2 min for visual at 5 shards,
          # 3.9 for desktop at 2 and 0.75 for mobile, against 2.3 min of Jest
          # per a11y shard at 3 per theme. The a11y leg finished four minutes
          # before the slowest component shard, so three of its nine slots buy
          # more here: visual 5 -> 7 and desktop 2 -> 3 take the heaviest
          # component job from 8.8 to ~7.4 min, and a11y at 2 shards per theme
          # lands at ~5.5. The critical path is the heaviest job, not the sum.
          case "$scope" in
            full | all)
              groups='{"visual":7,"desktop":3,"mobile":1}'
              a11y_shards=2
              ;;
            ui | none)
              # scope none keeps every heavy job skipped by its own `if`; the
              # matrix expression still has to parse, so it carries this shape.
              groups='{"visual":1,"desktop":2,"mobile":1}'
              a11y_shards=1
              ;;
            *)
              echo "::error::Unknown scope '${scope}' from the classifier"
              exit 1
              ;;
          esac
          # One declaration of each group's width; the matrix and expected.json
          # are both derived from it, so a shard count cannot drift between them.
          component_matrix="$(printf '%s' "$groups" | jq -c '{include: [to_entries[] | . as $group | range(1; $group.value + 1) | {group: $group.key, shard: ., total: $group.value}]}')"
          {
            echo "scope=${scope}"
            echo "list=${list}"
            echo "component_matrix=${component_matrix}"
            echo "a11y_shards=${a11y_shards}"
          } >> "$GITHUB_OUTPUT"
          # quality-gate checks the reports it collected against this file, so a
          # shard or theme that never reported fails loudly instead of passing.
          # At scope none nothing runs, so the file declares nothing expected -
          # the matrix output above keeps its shape only because the expression
          # still has to parse for a job the `if` then skips.
          jq -n \
            --arg scope "$scope" \
            --argjson matrix "$component_matrix" \
            --argjson groups "$groups" \
            --argjson themes "$A11Y_THEMES" \
            --argjson shards "$a11y_shards" \
            '($scope == "none") as $idle
            | {
                scope: $scope,
                components: (
                  if $idle then { include: [], groups: {}, total: 0 }
                  else {
                    include: $matrix.include,
                    groups: $groups,
                    total: ([$groups[]] | add)
                  }
                  end
                ),
                a11y: {
                  themes: (if $idle then [] else $themes end),
                  shards_per_theme: (if $idle then 0 else $shards end),
                  total: (if $idle then 0 else (($themes | length) * $shards) end)
                }
              }' > "$RUNNER_TEMP/expected.json"
          cat "$RUNNER_TEMP/expected.json"
      - if: steps.scope.outputs.list == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-changed-files-${{ inputs.sha }}
          path: ${{ runner.temp }}/changed-files.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-ci-expected-${{ inputs.sha }}
          path: ${{ runner.temp }}/expected.json
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline --filter='.' --filter='@techsio/ui-kit...'
      - run: pnpm --dir libs/ui typecheck
      - run: pnpm --dir libs/ui test
      - run: pnpm --dir libs/ui validate:tokens
      - run: pnpm --dir libs/ui check:package

  components:
    needs: plan
    if: needs.plan.outputs.scope != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # One entry per shard of each cost-homogeneous project group; plan decides
      # the widths and declares them in expected.json.
      matrix: ${{ fromJson(needs.plan.outputs.component_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline --filter='.' --filter='@techsio/ui-kit...'
      # Full Docker suite: behavior and the visual projects of this group, split
      # across the group's shards. Release mode rejects filters and baseline
      # updates; quality-gate asserts every identity over all shard reports.
      - name: Full release suite
        if: needs.plan.outputs.scope == 'full'
        env:
          PLAYWRIGHT_GROUP: ${{ matrix.group }}
          PLAYWRIGHT_RELEASE_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
        run: pnpm --dir libs/ui test:components:release
      - name: Download the changed-file list
        if: needs.plan.outputs.scope == 'ui'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ui-changed-files-${{ inputs.sha }}
          path: ${{ runner.temp }}/ui-changed-files
      - name: Affected screenshots and behavior specs
        if: needs.plan.outputs.scope == 'ui'
        env:
          PLAYWRIGHT_GROUP: ${{ matrix.group }}
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
          VISUAL_CHANGED_BEHAVIOR: "1"
          VISUAL_CHANGED_FILES_FROM: ${{ runner.temp }}/ui-changed-files/changed-files.txt
        run: pnpm --dir libs/ui test:components
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ui-component-results-${{ inputs.sha }}-${{ matrix.group }}-shard-${{ matrix.shard }}
          path: |
            libs/ui/playwright-report
            libs/ui/test-results
          if-no-files-found: error
      # Only on success: with if-no-files-found: error an unguarded upload fails a
      # second time inside a job whose test step already reported the failure.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: ui-component-report-${{ inputs.sha }}-${{ matrix.group }}-shard-${{ matrix.shard }}
          path: |
            libs/ui/test-results/visual-reports/all.json
            libs/ui/test-results/visual-reports/index.json
            libs/ui/test-results/visual-reports/changed-none.json
          if-no-files-found: error

  accessibility:
    uses: ./.github/workflows/storybook-a11y.yml
    needs: plan
    if: needs.plan.outputs.scope != 'none'
    with:
      sha: ${{ inputs.sha }}
      scope: ${{ needs.plan.outputs.scope }}
      changed_files_artifact: ${{ needs.plan.outputs.list == 'true' && format('ui-changed-files-{0}', inputs.sha) || '' }}
      # fromJson keeps these two as numbers: a job output is always a string and
      # storybook-a11y.yml declares both inputs as type number.
      shards: ${{ fromJson(needs.plan.outputs.a11y_shards) }}
      workers: 4
