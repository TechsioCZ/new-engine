name: UI quality

on:
  workflow_call:
    inputs:
      sha:
        description: Immutable commit to validate and publish
        required: true
        type: string
      mode:
        description: full runs everything; changed runs only what the diff can affect
        type: string
        default: full
      base_sha:
        description: Base commit for changed mode; empty falls back to the full run
        type: string
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  components:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      # Six browser runners plus main: seven hosted runners at peak.
      matrix:
        include:
          - {group: visual, shard: 1, total: 6, a11y_theme: ""}
          - {group: visual, shard: 2, total: 6, a11y_theme: n1-light}
          - {group: visual, shard: 3, total: 6, a11y_theme: ""}
          - {group: visual, shard: 4, total: 6, a11y_theme: ""}
          - {group: visual, shard: 5, total: 6, a11y_theme: ""}
          - {group: visual, shard: 6, total: 6, a11y_theme: ""}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/libs/ui/test/visual.spec.ts-snapshots/*
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1
      - name: Plan from this checkout
        id: scope
        env:
          MODE: ${{ inputs.mode }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.sha }}
        run: node libs/ui/scripts/ci-ui-plan.mjs
      # Only accessibility needs a host install. Screenshot dependencies live
      # in the cached container; the shared build never comes from these jobs.
      - if: steps.scope.outputs.scope != 'none' && matrix.a11y_theme != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install only the accessibility dependencies
        if: steps.scope.outputs.scope != 'none' && matrix.a11y_theme != ''
        run: pnpm install --frozen-lockfile --prefer-offline --filter='@techsio/ui-kit...'
      - name: Install the accessibility browser
        if: steps.scope.outputs.scope != 'none' && matrix.a11y_theme != ''
        run: timeout 420 pnpm --dir libs/ui exec playwright install --only-shell chromium
      # Screenshot dependencies are in the content-addressed image; the build
      # comes from main.
      # The image depends only on the Dockerfile, not this commit's stories.
      # One shard saves it; all shards can restore it, including fork PRs.
      - name: Restore the component browser image
        if: steps.scope.outputs.scope != 'none'
        id: browser-image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ui-playwright.tar
          key: ui-playwright-linux-amd64-${{ hashFiles('docker/development/playwright/Dockerfile') }}
      - name: Load the cached browser image
        if: steps.browser-image.outputs.cache-hit == 'true'
        run: docker load --input "$RUNNER_TEMP/ui-playwright.tar"
      - name: Build a missing browser image while main builds Storybook
        if: steps.scope.outputs.scope != 'none' && steps.browser-image.outputs.cache-hit != 'true'
        run: |
          image="$(node libs/ui/scripts/run-component-tests.mjs --print-plan | jq -er .image)"
          docker build -t "$image" -f docker/development/playwright/Dockerfile .
      - name: Wait for the shared build, not the producer's later tests
        if: steps.scope.outputs.scope != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node libs/ui/scripts/ci-artifact.mjs wait "ui-storybook-${{ inputs.sha }}" main
      - name: Download the shared Storybook build
        if: steps.scope.outputs.scope != 'none'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ui-storybook-${{ inputs.sha }}
          path: libs/ui/storybook-static
      - name: Check out only this bundle's reviewed baselines
        if: steps.scope.outputs.scope != 'none' && matrix.group == 'visual'
        env:
          SHARD: ${{ matrix.shard }}/${{ matrix.total }}
          SCOPE: ${{ steps.scope.outputs.scope }}
          VISUAL_CHANGED_FILES_FROM: ${{ runner.temp }}/ui-changed-files/changed-files.txt
        run: node libs/ui/scripts/component-baselines.mjs
      - name: Run the bundle's component suites
        if: steps.scope.outputs.scope != 'none'
        env:
          BUNDLE_GROUP: ${{ matrix.group }}
          BUNDLE_BEHAVIOR: ${{ matrix.shard == 1 }}
          SCOPE: ${{ steps.scope.outputs.scope }}
          SHARD: ${{ matrix.shard }}/${{ matrix.total }}
          VISUAL_CHANGED_FILES_FROM: ${{ runner.temp }}/ui-changed-files/changed-files.txt
        run: bash libs/ui/scripts/component-ci-bundle.sh
      - name: Scan this bundle's accessibility theme
        if: steps.scope.outputs.scope != 'none' && matrix.a11y_theme != ''
        env:
          A11Y_STORYBOOK_REBUILD: "0"
          A11Y_THEME: ${{ matrix.a11y_theme }}
          A11Y_THEME_COUNT: "3"
          A11Y_SHARD: 1/1
          A11Y_TEST_WORKERS: "4"
          A11Y_REPORT_FAIL_ON_VIOLATIONS: "true"
          A11Y_SCOPE: ${{ steps.scope.outputs.scope }}
          A11Y_CHANGED_FILES_FROM: ${{ runner.temp }}/ui-changed-files/changed-files.txt
        run: pnpm --dir libs/ui storybook:a11y
      - name: Upload accessibility coverage and calibration
        if: always() && steps.scope.outputs.scope != 'none' && matrix.a11y_theme != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-a11y-${{ inputs.sha }}-${{ matrix.a11y_theme }}
          path: libs/ui/a11y-report
          overwrite: true
          if-no-files-found: error
      - name: Upload component coverage
        if: success() && steps.scope.outputs.scope != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-component-report-${{ inputs.sha }}-${{ matrix.group }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/component-reports
          overwrite: true
          if-no-files-found: error
      - name: Upload component failure details
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-component-results-${{ inputs.sha }}-${{ matrix.group }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/component-results
          overwrite: true
          if-no-files-found: error
      - name: Export the component browser image
        id: exported-image
        if: success() && matrix.shard == 6 && steps.browser-image.outputs.cache-hit != 'true'
        run: |
          image="$(node libs/ui/scripts/run-component-tests.mjs --print-plan | jq -er .image)"
          # A changed run with no selected stories never needs a container.
          if docker image inspect "$image" >/dev/null 2>&1; then
            docker image save "$image" --output "$RUNNER_TEMP/ui-playwright.tar"
            echo "saved=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the component browser image
        if: steps.exported-image.outputs.saved == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ui-playwright.tar
          key: ui-playwright-linux-amd64-${{ hashFiles('docker/development/playwright/Dockerfile') }}
