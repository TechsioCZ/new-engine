name: UI quality

on:
  workflow_call:
    inputs:
      sha:
        description: Immutable commit to validate and publish
        required: true
        type: string
      mode:
        description: full runs everything; changed runs only what the diff can affect
        type: string
        default: full
      base_sha:
        description: Base commit for changed mode; empty falls back to the full run
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      list: ${{ steps.scope.outputs.list }}
      component_matrix: ${{ steps.scope.outputs.component_matrix }}
    steps:
      - if: inputs.mode == 'changed'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /libs/ui/scripts/
            /libs/ui/test/visual-completion.mjs
          persist-credentials: false
      - if: inputs.mode == 'changed'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1
      # Any doubt (no base, no merge-base) keeps the full scope; never "none".
      # -z keeps paths unquoted, so non-ASCII names still reach the classifier.
      - id: scope
        env:
          MODE: ${{ inputs.mode }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.sha }}
          # Must match storybook-a11y.yml's theme matrix; that scan fails on a
          # count mismatch, so a drift here cannot pass silently.
          A11Y_THEMES: '["business-light","akros-light","n1-light"]'
        run: |
          set -euo pipefail
          scope=full
          list=false
          if [ "$MODE" = "changed" ] && [ -n "$BASE_SHA" ] && base="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null)"; then
            git diff -z --name-only --no-renames "$base" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
            scope="$(node libs/ui/scripts/visual-affected-stories.mjs --scope --files-from "$RUNNER_TEMP/changed-files.txt")"
            list=true
          fi
          # Five bundles share checkout, install, Storybook and browser restore
          # across visual and behavior work. Accessibility shares a fifth runner.
          bundles=5
          case "$scope" in
            full | all | ui)
              groups="$(jq -cn --argjson n "$bundles" '{visual:$n,desktop:$n,mobile:1}')"
              a11y_shards=1
              ;;
            none)
              # scope none keeps every heavy job skipped by its own `if`; the
              # matrix expression still has to parse, so it carries this shape.
              groups='{"visual":1,"desktop":2,"mobile":1}'
              a11y_shards=1
              ;;
            *)
              echo "::error::Unknown scope '${scope}' from the classifier"
              exit 1
              ;;
          esac
          # The five bundles each own a visual and desktop quarter; the last
          # also owns mobile behavior. Accessibility scans all themes together.
          component_matrix="$(jq -cn --argjson n "$bundles" \
            '{include:[range(1;$n+1) | {group:"visual",shard:.,total:$n}]}')"
          {
            echo "scope=${scope}"
            echo "list=${list}"
            echo "component_matrix=${component_matrix}"
          } >> "$GITHUB_OUTPUT"
          # quality-gate checks the reports it collected against this file, so a
          # shard or theme that never reported fails loudly instead of passing.
          # At scope none nothing runs, so the file declares nothing expected -
          # the matrix output above keeps its shape only because the expression
          # still has to parse for a job the `if` then skips.
          jq -n \
            --arg scope "$scope" \
            --argjson matrix "$component_matrix" \
            --argjson groups "$groups" \
            --argjson themes "$A11Y_THEMES" \
            --argjson shards "$a11y_shards" \
            '($scope == "none") as $idle
            | {
                scope: $scope,
                components: (
                  if $idle then { include: [], groups: {}, total: 0 }
                  else {
                    include: $matrix.include,
                    groups: $groups,
                    total: ([$groups[]] | add)
                  }
                  end
                ),
                a11y: {
                  themes: (if $idle then [] else $themes end),
                  shards_per_theme: (if $idle then 0 else $shards end),
                  total: (if $idle then 0 else (($themes | length) * $shards) end)
                }
              }' > "$RUNNER_TEMP/expected.json"
          cat "$RUNNER_TEMP/expected.json"
      - if: steps.scope.outputs.list == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-changed-files-${{ inputs.sha }}
          path: ${{ runner.temp }}/changed-files.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-ci-expected-${{ inputs.sha }}
          path: ${{ runner.temp }}/expected.json
          if-no-files-found: error

      - if: steps.scope.outputs.scope != 'none'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/libs/ui/test/visual.spec.ts-snapshots/
          persist-credentials: false
      - if: steps.scope.outputs.scope != 'none'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.scope.outputs.scope != 'none'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1
      - if: steps.scope.outputs.scope != 'none'
        run: pnpm install --frozen-lockfile --prefer-offline --filter='@techsio/ui-kit...'
      - name: Hash the Storybook inputs
        if: steps.scope.outputs.scope != 'none'
        id: storybook
        run: echo "hash=$(node libs/ui/scripts/visual-storybook-build.mjs --inputs-hash)" >> "$GITHUB_OUTPUT"
      - name: Restore Storybook for unchanged inputs
        if: steps.scope.outputs.scope != 'none'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: libs/ui/storybook-static
          key: ui-storybook-node26-${{ steps.storybook.outputs.hash }}
      - name: Build Storybook once
        if: steps.scope.outputs.scope != 'none'
        run: node libs/ui/scripts/visual-storybook-build.mjs --ensure
      - name: Share the immutable Storybook build
        if: steps.scope.outputs.scope != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-storybook-${{ inputs.sha }}
          path: libs/ui/storybook-static
          include-hidden-files: true
          if-no-files-found: error

  accessibility:
    needs: plan
    if: needs.plan.outputs.scope != 'none'
    uses: ./.github/workflows/storybook-a11y.yml
    with:
      sha: ${{ inputs.sha }}
      scope: ${{ needs.plan.outputs.scope }}
      workers: 4
      storybook_artifact: ui-storybook-${{ inputs.sha }}
      changed_files_artifact: ${{ needs.plan.outputs.list == 'true' && format('ui-changed-files-{0}', inputs.sha) || '' }}

  components:
    needs: plan
    if: needs.plan.outputs.scope != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      # Five runners, not a separate runner for each suite.
      matrix: ${{ fromJson(needs.plan.outputs.component_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1
      # Only Node built-ins run on the host. Browser/test dependencies are
      # already in the content-addressed image; Storybook comes from plan.
      # The image depends only on the Dockerfile, not this commit's stories.
      # One shard saves it; all shards can restore it, including fork PRs.
      - name: Restore the component browser image
        id: browser-image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ui-playwright.tar
          key: ui-playwright-linux-amd64-${{ hashFiles('docker/development/playwright/Dockerfile') }}
      - name: Load the cached browser image
        if: steps.browser-image.outputs.cache-hit == 'true'
        run: docker load --input "$RUNNER_TEMP/ui-playwright.tar"
      - name: Download the changed-file list
        if: needs.plan.outputs.list == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ui-changed-files-${{ inputs.sha }}
          path: ${{ runner.temp }}/ui-changed-files
      - name: Download the shared Storybook build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ui-storybook-${{ inputs.sha }}
          path: libs/ui/storybook-static
      - name: Run the bundle's component suites
        env:
          CI_BUNDLE_CPU: "1"
          SCOPE: ${{ needs.plan.outputs.scope }}
          SHARD: ${{ matrix.shard }}/${{ matrix.total }}
          BUNDLE: ${{ matrix.shard }}
          BUNDLES: ${{ matrix.total }}
          VISUAL_CHANGED_FILES_FROM: ${{ runner.temp }}/ui-changed-files/changed-files.txt
        run: bash libs/ui/scripts/component-ci-bundle.sh
      - name: Upload component coverage
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-component-report-${{ inputs.sha }}-bundle-${{ matrix.shard }}
          path: ${{ runner.temp }}/component-reports
          if-no-files-found: error
      - name: Upload component failure details
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-component-results-${{ inputs.sha }}-bundle-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/component-results
          if-no-files-found: error
      - name: Export the component browser image
        id: exported-image
        if: success() && matrix.shard == 5 && steps.browser-image.outputs.cache-hit != 'true'
        run: |
          image="$(node libs/ui/scripts/run-component-tests.mjs --print-plan | jq -er .image)"
          # A changed run with no selected stories never needs a container.
          if docker image inspect "$image" >/dev/null 2>&1; then
            docker image save "$image" --output "$RUNNER_TEMP/ui-playwright.tar"
            echo "saved=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the component browser image
        if: steps.exported-image.outputs.saved == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ui-playwright.tar
          key: ui-playwright-linux-amd64-${{ hashFiles('docker/development/playwright/Dockerfile') }}
