name: UI polish screenshot capture

# Temporary branch-owned evidence job. Remove after reviewing and promoting
# its screenshots; the normal release gate must remain read-only.
on:
  push:
    branches: [feat/ui-polish-overhaul]
    paths: [.github/workflows/ui-polish-capture.yml]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # The full component capture at f3255be covers the unchanged runtime.
          # Only these four stories changed after that capture.
          - { label: refinements, brand: "base,neo,business,akros", shard: "" }
    env:
      STORYBOOK_DISABLE_TELEMETRY: "1"
      PLAYWRIGHT_WORKERS: "2"
      VISUAL_BRANDS: ${{ matrix.brand }}
      PLAYWRIGHT_RELEASE_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.11.1
          cache: pnpm
      - name: Install the UI toolchain
        run: pnpm install --frozen-lockfile --prefer-offline --filter='.' --filter='@techsio/ui-kit...'
      - name: Build the checked-out Storybook
        run: pnpm --dir libs/ui exec storybook build
      - name: Select the refined stories
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_ENV"
          import fs from "node:fs";
          import { visualStories } from "./libs/ui/test/visual-completion.mjs";
          const index = JSON.parse(fs.readFileSync("libs/ui/storybook-static/index.json", "utf8"));
          const available = new Set(visualStories(index.entries).map(({ id }) => id));
          const ids = [
            "overview-business-theme--playground",
            "pages-e-commerce-dashboard-home--default",
            "pages-e-commerce-orders-dashboard--default",
            "molecules-combobox--sizes",
          ];
          for (const id of ids) {
            if (!available.has(id)) throw new Error(`Missing review story: ${id}`);
          }
          console.log(`TEST_STORIES=${ids.join(",")}`);
          JS
      - name: Capture candidate screenshots in the pinned runner
        env:
          PLAYWRIGHT_STORYBOOK_REBUILD: "0"
        run: pnpm --dir libs/ui exec node scripts/run-component-tests.mjs --update-snapshots=all test/visual.spec.ts
      - name: Collect changed screenshots with their source revision
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import { execFileSync } from "node:child_process";
          const folder = "libs/ui/test/visual.spec.ts-snapshots";
          const changed = execFileSync("git", ["diff", "--name-only", "-z", "--", folder]).toString().split("\0");
          const added = execFileSync("git", ["ls-files", "--others", "--exclude-standard", "-z", "--", folder]).toString().split("\0");
          const files = [...new Set([...changed, ...added])].filter(file => file.endsWith(".png") && fs.existsSync(file));
          const output = "libs/ui/build/council-baselines";
          fs.mkdirSync(output, { recursive: true });
          for (const file of files) fs.copyFileSync(file, path.join(output, path.basename(file)));
          fs.writeFileSync(path.join(output, "capture-manifest.json"), JSON.stringify({
            head: process.env.GITHUB_SHA,
            brand: process.env.VISUAL_BRANDS,
            shard: process.env.PLAYWRIGHT_RELEASE_SHARD,
            files: files.map(file => path.basename(file)),
          }, null, 2));
          console.log(`Collected ${files.length} changed screenshots.`);
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: business-ui-baselines-${{ github.sha }}-${{ matrix.label }}
          path: |
            libs/ui/build/council-baselines
            libs/ui/test-results
            libs/ui/playwright-report
          if-no-files-found: error
          retention-days: 7
