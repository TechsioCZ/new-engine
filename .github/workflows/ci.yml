name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-24.04
    env:
      NX_NO_CLOUD: "true"
    steps:
      # nx-set-shas needs the commit graph, not the file contents of every
      # commit in it, so a blobless clone keeps full history at a third of the
      # wall clock (measured 35s -> ~15s).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/libs/ui/test/visual.spec.ts-snapshots/
          persist-credentials: false

      - name: Plan UI coverage during the existing checkout
        id: scope
        env:
          MODE: ${{ github.event_name == 'push' && 'full' || 'changed' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: node libs/ui/scripts/ci-ui-plan.mjs

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Every browser bundle waits for the shared Storybook build, so its path
      # comes first: Node 26, one install, the build. Node 24 and Nx follow.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1
      - id: node26-runtime
        run: echo "bin=$(dirname "$(command -v node)")" >> "$GITHUB_OUTPUT"

      # Restoring the 1.36 GB workspace store took 25s before a 32s install;
      # a fresh install took 50s. Avoid that transfer on the build's critical path.
      # This host's platform only: supportedArchitectures also lists darwin,
      # arm64 and musl for the shared Docker store (951 of 1,225 MB downloaded).
      - run: pnpm install --frozen-lockfile --prefer-offline --os linux --cpu x64 --libc glibc

      # Browser runners prepare concurrently and consume this build before this
      # job's later lint/typecheck/unit checks finish. The quality gate needs both.
      - id: ui-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scope="$(jq -er .scope "$RUNNER_TEMP/ui-build-plan/expected.json")"
          build=false
          if [ "$scope" != none ]; then
            exists="$(node libs/ui/scripts/ci-artifact.mjs exists "ui-storybook-${{ github.sha }}")"
            case "$exists" in
              true) ;;
              false) build=true ;;
              *) echo "::error::Invalid artifact readiness: $exists"; exit 1 ;;
            esac
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Hash the Storybook inputs
        if: steps.ui-build.outputs.build == 'true'
        id: storybook
        run: echo "hash=$(node libs/ui/scripts/visual-storybook-build.mjs --inputs-hash)" >> "$GITHUB_OUTPUT"
      - name: Restore Storybook for unchanged inputs
        if: steps.ui-build.outputs.build == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: libs/ui/storybook-static
          key: ui-storybook-node26-${{ steps.storybook.outputs.hash }}
      - name: Build Storybook once
        if: steps.ui-build.outputs.build == 'true'
        run: node libs/ui/scripts/visual-storybook-build.mjs --ensure
      - name: Share the immutable Storybook build
        if: steps.ui-build.outputs.build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-storybook-${{ github.sha }}
          path: libs/ui/storybook-static
          include-hidden-files: true
          if-no-files-found: error

      - name: Declare the required coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-ci-expected-${{ github.sha }}
          path: ${{ runner.temp }}/ui-build-plan/expected.json
          overwrite: true
          if-no-files-found: error

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - id: node24-runtime
        run: echo "bin=$(dirname "$(command -v node)")" >> "$GITHUB_OUTPUT"
      - uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4
      - name: Determine affected projects
        id: determine_affected
        run: |
          base="${NX_BASE:-origin/master}"
          head="${NX_HEAD:-HEAD}"
          projects_json="$(./node_modules/.bin/nubx --node nx show projects --affected --json --base="$base" --head="$head")"
          projects="$(printf '%s' "$projects_json" | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const projects = input.trim() ? JSON.parse(input) : []; if (!Array.isArray(projects)) { throw new Error("Expected an array from nx show projects --json"); } process.stdout.write(projects.join(",")); });')"
          echo "projects=${projects}" >> "$GITHUB_OUTPUT"
          echo "projects_csv=,${projects}," >> "$GITHUB_OUTPUT"
      - name: Restore the same immutable build on a job retry
        if: steps.ui-build.outputs.scope != 'none' && steps.ui-build.outputs.build != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ui-storybook-${{ github.sha }}
          path: libs/ui/storybook-static
      # business-light and half of akros-light share this install; bundle 2
      # scans n1-light and the other half.
      - name: Run workspace, UI package and accessibility checks
        env:
          NODE24_BIN: ${{ steps.node24-runtime.outputs.bin }}
          NODE26_BIN: ${{ steps.node26-runtime.outputs.bin }}
          UI_SCOPE: ${{ steps.ui-build.outputs.scope }}
          A11Y_STORYBOOK_REBUILD: "0"
          AFFECTED_PROJECTS: ${{ steps.determine_affected.outputs.projects }}
        run: bash libs/ui/scripts/main-ci-checks.sh
      - name: Upload accessibility coverage and calibration
        if: always() && steps.ui-build.outputs.scope != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-a11y-${{ github.sha }}-main-themes
          path: libs/ui/a11y-report
          overwrite: true
          if-no-files-found: error

  # A pull request runs only what its diff can affect, measured against its
  # base; a change that cannot reach the UI library skips the components and
  # accessibility jobs, workflow changes force the full run, and dependency or
  # build-input changes count as "all".
  #
  # A push to master runs mode: full. That is the release-readiness gate and it
  # lives here now, because verifyFullShards -> assertVisualCompletion over every
  # story x every createVisualMatrix project is reachable only in full mode
  # (libs/ui/scripts/verify-component-shards.mjs). ui-release-trigger (or
  # ui-release-retrigger on a re-run) starts ui-release.yml, which requires this
  # workflow's success before publishing. This call must never be made
  # conditional: a skipped need would take quality-gate with it.
  ui-quality:
    uses: ./.github/workflows/ui-quality.yml
    with:
      sha: ${{ github.sha }}
      mode: ${{ github.event_name == 'push' && 'full' || 'changed' }}
      base_sha: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

  # The release prepares while the browser bundles finish, then publishes only
  # after this run succeeds for its exact SHA. Started when main ends, it never
  # holds an eighth hosted runner idle beside the six bundles and main.
  # First attempt only: a re-run starts the release from ui-release-retrigger.
  ui-release-trigger:
    needs: main
    if: github.run_attempt == '1' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start the UI release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ui-release.yml --ref master

  # "Re-run failed jobs" repeats only failed jobs and their dependents, so a
  # main that passed the first time never dispatches again, while the release
  # that attempt started already failed on the red CI. Depending on
  # quality-gate makes this job a dependent of every job that can fail, and it
  # starts the release once a re-run is green. Skipped on the first attempt,
  # so it takes no runner there.
  ui-release-retrigger:
    needs: quality-gate
    if: github.run_attempt != '1' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start the UI release for this re-run commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ui-release.yml --ref master

  # Required status check for master (ruleset "Master"). It fails unless every
  # job in `needs` succeeded, so the ruleset has one stable name to require.
  # To make another job blocking, add it to `needs`; don't edit the ruleset.
  quality-gate:
    name: quality-gate
    if: always()
    needs:
      - main
      - ui-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every blocking job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Blocking jobs did not succeed: $failed"
            exit 1
          fi

      # The heavy jobs prove their own shard ran clean. This is the only place
      # that proves the matrix plan declared reported in full, so a shard that
      # never ran cannot pass as silence. It replaces the separate
      # components-complete job and its runner acquisition.
      #
      # libs/ui only and no install: both verifiers import node: builtins plus
      # sibling files inside libs/ui (test/visual-completion.mjs,
      # test/visual-projects.mjs, src/theme/theme-config.ts via Node's type
      # stripping) and resolve nothing from node_modules.
      - name: Check out the shard verifiers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /libs/ui/scripts/
            /libs/ui/test/*.mjs
            /libs/ui/test/*.json
            /libs/ui/src/theme/theme-config.ts
            /libs/ui/.storybook/a11y-policy.mjs
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1

      # An existing but empty directory is a valid input: scope=none declares
      # zero shards and uploads no reports.
      - name: Prepare the report directories
        run: mkdir -p "$RUNNER_TEMP/component-shards" "$RUNNER_TEMP/a11y-shards"

      # Named, so a missing matrix plan fails the gate instead of passing it.
      - name: Download the declared shard matrix
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ui-ci-expected-${{ github.sha }}
          path: ${{ runner.temp }}/ui-expected

      # Pattern downloads: this action's pattern path downloads zero artifacts
      # without failing, which keeps "expected N, found 0" the verifiers' call
      # rather than the download's.
      - name: Download the component shard reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ui-component-report-${{ github.sha }}*
          path: ${{ runner.temp }}/component-shards

      - name: Download the accessibility shard reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: storybook-a11y-${{ github.sha }}*
          path: ${{ runner.temp }}/a11y-shards

      - name: Flatten component bundle reports
        run: |
          mkdir -p "$RUNNER_TEMP/component-groups"
          find "$RUNNER_TEMP/component-shards" -mindepth 2 -maxdepth 2 -type d \
            -exec mv -t "$RUNNER_TEMP/component-groups" {} +

      - name: Verify every declared component shard reported
        run: |
          node libs/ui/scripts/verify-component-shards.mjs \
            --expect "$RUNNER_TEMP/ui-expected/expected.json" \
            --reports "$RUNNER_TEMP/component-groups"

      - name: Verify every declared accessibility shard reported
        run: |
          node libs/ui/scripts/verify-a11y-shards.mjs \
            --expect "$RUNNER_TEMP/ui-expected/expected.json" \
            --reports "$RUNNER_TEMP/a11y-shards"
